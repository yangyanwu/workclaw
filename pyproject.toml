[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workclaw"
version = "0.1.0"
description = "AI-powered developer tool that integrates Jira, GitHub, and Bitbucket for automated code analysis and PR creation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "WorkClaw Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "typer[all]>=0.15.0",
    "rich>=13.9.0",
    "litellm>=1.82.0,!=1.82.7,!=1.82.8",
    "gitpython>=3.1.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.0",
    "websockets>=14.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "httpx[http2]>=0.28.0",
]

[project.scripts]
workclaw = "workclaw.main:cli_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/workclaw"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: marks tests that require external services"]

[tool.mypy]
python_version = "3.11"
strict = true
